<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  This file is the shared player shell, not a public landing page.
  src/index.js fetches it from the asset store and transforms it in place for
  the canonical /play/{id}/{slug} route (title, description, canonical, OG,
  Twitter, JSON-LD, and visible Indonesian SEO copy). The raw shell is
  therefore noindex and must never be linked directly. Each game gets its own
  server-rendered canonical; there is intentionally no canonical tag here.
-->
<meta name="robots" content="noindex, follow">
<title>Loading… — Gimboot</title>
<meta name="description" content="Play instantly in your browser — no downloads, no sign-up. No install, just play, have fun.">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e0b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimboot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="chase-strip" aria-hidden="true"></div>
  <div class="header-inner">
    <a href="/" class="brand-lockup">
      <img src="/icon-192.png" alt="" class="brand-icon" width="64" height="64">
      <span class="brand-text">
        <span class="wordmark">GIMBOOT</span>
        <span class="tagline">No Install, Just Play, Have Fun</span>
      </span>
    </a>
    <a href="/" class="btn btn--ghost ml-auto">&larr; Back to Catalog</a>
  </div>
</header>

<main>
  <div class="player-bar">
    <div class="player-heading">
      <h1 id="game-title">Loading…</h1>
      <span class="game-card__tag" id="game-category"></span>
    </div>
    <div class="player-actions">
      <span id="high-score" class="high-score-pill">High Score: 0</span>
      <button type="button" class="btn btn--ghost player-favorite" id="favorite-btn" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites">
        <span class="player-favorite__icon" aria-hidden="true">&#9825;</span>
        <span id="favorite-label">Favorite</span>
      </button>
      <button type="button" class="btn btn--ghost" id="fullscreen-btn">&#10530; Full Screen</button>
      <button type="button" class="btn btn--primary" id="share-btn">Share</button>
      <span class="share-feedback" id="share-feedback" hidden></span>
    </div>
  </div>

  <div class="frame-shell">
    <div class="frame-bezel">
      <div class="frame-wrap" id="frame-wrap">
        <div class="frame-placeholder" id="frame-placeholder">
          <button type="button" class="btn btn--primary btn--play" id="play-btn">
            &#9654; Play Now
          </button>
          <p class="frame-placeholder__hint">Click to load the game instantly in your browser</p>
        </div>
        <iframe
          id="game-frame"
          src=""
          allow="autoplay; fullscreen"
          loading="lazy"
          title=""
          hidden></iframe>
      </div>
    </div>
  </div>

  <div class="status-block" id="player-status" hidden></div>

  <!--
    Visible game copy (Tentang / Cara Bermain / Fitur) is injected server-side
    by functions/game.js into #game-seo-content. Keeping a second static copy
    here would duplicate the same H2s and keyword-stuff the page.
  -->

  <section class="related-section">
    <h2>Related Games</h2>
    <div class="related-grid" id="related-grid"></div>
    <p class="status-subtitle" id="related-status" hidden></p>
  </section>
</main>

<footer class="site-footer">
  <p>Gimboot — no install, just play, have fun. &copy; 2026 Powered by <a href="https://hazanacorp.farisi55.workers.dev/" target="_blank" rel="noopener">Hazana Corp</a>.</p>
</footer>

<script type="module" src="/js/player.js"></script>
<script src="/js/pwa.js"></script>
<script type="module">
  import { loadScriptWithTimeout } from '/js/ad-loader.js';
  import { CONFIG } from '/js/config.js';
  if (CONFIG.AD_SCRIPT_URL) {
    loadScriptWithTimeout(CONFIG.AD_SCRIPT_URL);
  }
</script>
</body>
</html>
