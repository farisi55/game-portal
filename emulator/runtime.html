<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script data-gimboot-canonical>
(function () {
  var d = document;
  if (d.querySelector('link[rel="canonical"]')) return;
  var h = location.hostname.toLowerCase();
  if (h === "localhost" || h === "127.0.0.1" || h === "0.0.0.0" || h === "[::1]") return;

  var ORIGIN = "https://gimboot.com";
  var path = location.pathname || "/";
  var search = location.search || "";
  var LOCAL = {
    "/games/kicau-mania": "/play/local-kicau-mania/kicau-mania",
    "/games/ayo-kopdes": "/play/local-ayo-kopdes/ayo-kopdes",
    "/games/mobil-mbg": "/play/local-mobil-mbg/mobil-mbg",
    "/games/kejar-koruptor": "/play/local-kejar-koruptor/kejar-koruptor",
    "/games/solitaire": "/play/local-solitaire/solitaire",
    "/games/moba": "/play/local-moba/moba-dota"
  };

  function slugify(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "game";
  }

  var noSlash = path.replace(/\/+$/, "") || "/";
  var canonicalPath = "";

  if (noSlash === "/" || /^\/index\.html?$/i.test(path)) {
    canonicalPath = "";
  } else if (/^\/game(\.html)?$/i.test(noSlash)) {
    var params = new URLSearchParams(search);
    var id = params.get("id");
    var title = params.get("title");
    canonicalPath = id
      ? "/play/" + encodeURIComponent(id) + (title ? "/" + slugify(title) : "")
      : "/game";
  } else {
    var directoryKey = path.replace(/\/index\.html?$/i, "").replace(/\/+$/, "");
    if (LOCAL[directoryKey]) {
      canonicalPath = LOCAL[directoryKey];
    } else if (/\/index\.html?$/i.test(path)) {
      canonicalPath = path.replace(/index\.html?$/i, "");
    } else if (/^\/games\/[^/]+$/i.test(noSlash) || noSlash === "/emulator") {
      canonicalPath = noSlash + "/";
    } else {
      canonicalPath = noSlash.replace(/\.html?$/i, "");
    }
  }

  var link = d.createElement("link");
  link.rel = "canonical";
  link.href = ORIGIN + canonicalPath;
  d.head.appendChild(link);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emulator Runtime — Gimboot</title>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var loaded = false;
  // Task #024: every system key shipped in the /emulator dropdown. The
  // aggregate "sega" alias is intentionally excluded (covered by segaMD).
  var ALLOWED_CORES = {
    // Nintendo
    nes: 1, snes: 1, gb: 1, gba: 1, n64: 1, nds: 1, vb: 1,
    // Sony
    psx: 1, psp: 1,
    // Sega
    segaMD: 1, segaMS: 1, segaGG: 1, segaCD: 1, sega32x: 1, segaSaturn: 1,
    // Atari
    atari2600: 1, atari5200: 1, atari7800: 1, lynx: 1, jaguar: 1,
    // Arcade
    arcade: 1, mame: 1,
    // Computers
    dos: 1, amiga: 1, c64: 1, c128: 1, pet: 1, plus4: 1, vic20: 1,
    // Other consoles
    coleco: 1, pce: 1, pcfx: 1, ws: 1, ngp: 1, "3do": 1
  };
  // Cores that hard-require SharedArrayBuffer (EmulatorJS: requiresThreads).
  // SAB only exists on this page because /emulator/* is cross-origin
  // isolated (COOP: same-origin + COEP: require-corp set by the Worker).
  var THREAD_CORES = { psp: 1, dos: 1 };
  var MB = 1048576;
  var DEFAULT_MAX_ROM_SIZE = 128 * MB;
  var SYSTEM_MAX_ROM_SIZE = { psx: 999 * MB, psp: 2048 * MB };
  function maxRomSizeFor(core) {
    return SYSTEM_MAX_ROM_SIZE[core] || DEFAULT_MAX_ROM_SIZE;
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (!d || d.type !== 'gimboot:load' || loaded) return;
    if (typeof d.core !== 'string' || !ALLOWED_CORES[d.core]) return;
    if (!(d.rom instanceof File) || d.rom.size === 0 || d.rom.size > maxRomSizeFor(d.core)) return;

    loaded = true;

    window.EJS_player = '#game';
    window.EJS_core = d.core;
    if (THREAD_CORES[d.core]) {
      window.EJS_threads = true;
    }
    window.EJS_gameUrl = URL.createObjectURL(d.rom);
    window.EJS_biosUrl = (d.bios instanceof File && d.bios.size > 0)
      ? URL.createObjectURL(d.bios)
      : '';
    window.EJS_pathtodata = '/vendor/emulatorjs/';
    window.EJS_language = 'en-US';
    window.EJS_disableAutoLang = false;
    window.EJS_startOnLoaded = true;

    window.EJS_ready = function () {
      parent.postMessage({ type: 'gimboot:started' }, location.origin);
    };

    var s = document.createElement('script');
    s.src = '/vendor/emulatorjs/loader.js';
    document.head.appendChild(s);
  });

  // Tell the parent this runtime is ready to accept a ROM.
  parent.postMessage({ type: 'gimboot:runtime-ready' }, location.origin);
})();
</script>
</body>
</html>
