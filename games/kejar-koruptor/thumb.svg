<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#251a3e"/>
      <stop offset="85%" stop-color="#63304a"/>
      <stop offset="100%" stop-color="#93413a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33333d"/>
      <stop offset="100%" stop-color="#4a4a56"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="512" height="384" fill="url(#sky)"/>
  <g fill="#e8ecff">
    <rect x="40" y="30" width="2" height="2"/><rect x="90" y="55" width="2" height="2"/>
    <rect x="150" y="25" width="2" height="2"/><rect x="210" y="48" width="2" height="2"/>
    <rect x="330" y="30" width="2" height="2"/><rect x="390" y="60" width="2" height="2"/>
    <rect x="450" y="35" width="2" height="2"/><rect x="480" y="70" width="2" height="2"/>
  </g>
  <circle cx="420" cy="58" r="26" fill="#f6f0c8" opacity="0.25"/>
  <circle cx="420" cy="58" r="17" fill="#f6f0c8"/>

  <!-- city skyline -->
  <g fill="#1c2136">
    <rect x="0" y="150" width="40" height="60"/><rect x="90" y="160" width="34" height="50"/>
    <rect x="200" y="150" width="40" height="60"/><rect x="300" y="160" width="44" height="50"/>
    <rect x="420" y="150" width="40" height="60"/>
  </g>
  <g fill="#12162a">
    <rect x="30" y="120" width="46" height="90"/><rect x="120" y="132" width="38" height="78"/>
    <rect x="250" y="112" width="48" height="98"/><rect x="360" y="128" width="40" height="82"/>
    <rect x="470" y="124" width="42" height="86"/>
  </g>
  <g fill="#f7d97b">
    <rect x="38" y="132" width="3" height="4"/><rect x="48" y="146" width="3" height="4"/>
    <rect x="58" y="138" width="3" height="4"/><rect x="130" y="146" width="3" height="4"/>
    <rect x="142" y="160" width="3" height="4"/><rect x="262" y="126" width="3" height="4"/>
    <rect x="276" y="142" width="3" height="4"/><rect x="286" y="158" width="3" height="4"/>
    <rect x="372" y="142" width="3" height="4"/><rect x="384" y="156" width="3" height="4"/>
    <rect x="482" y="140" width="3" height="4"/><rect x="494" y="156" width="3" height="4"/>
  </g>
  <!-- monument -->
  <rect x="228" y="118" width="9" height="94" fill="#0e1120"/>
  <path d="M224,118 L241,118 L232.5,88 L224,118 Z" fill="#0e1120"/>
  <path d="M232.5,74 L236.5,90 L232.5,94 L228.5,90 Z" fill="#e8b44a"/>

  <!-- ground -->
  <rect y="210" width="512" height="174" fill="#1a1c29"/>

  <!-- perspective road -->
  <path d="M236,210 L276,210 L470,384 L42,384 Z" fill="url(#road)"/>
  <path d="M238,210 L243,210 L150,384 L120,384 Z" fill="#c8c8bd"/>
  <path d="M269,210 L274,210 L392,384 L362,384 Z" fill="#c8c8bd"/>
  <path d="M234.5,210 L236.5,210 L96,384 L84,384 Z" fill="#d8d8d0"/>
  <path d="M275.5,210 L277.5,210 L428,384 L416,384 Z" fill="#d8d8d0"/>

  <!-- money bag on the road -->
  <g transform="translate(150,250) scale(0.9)">
    <circle cx="20" cy="26" r="34" fill="#ffd76a" opacity="0.3"/>
    <path d="M20,10 C10,10 5,20 5,30 C5,40 12,44 20,44 C28,44 35,40 35,30 C35,20 30,10 20,10 Z" fill="#8a5a2b"/>
    <path d="M13,4 L27,4 L24,12 L16,12 Z" fill="#7a4d24"/>
    <text x="20" y="40" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffd76a">$</text>
  </g>

  <!-- police car roadblock -->
  <g transform="translate(280,236) scale(1.15)">
    <rect x="20" y="2" width="14" height="6" rx="2" fill="#e03a3a"/>
    <rect x="38" y="2" width="14" height="6" rx="2" fill="#2f6fd1"/>
    <rect x="18" y="7" width="36" height="3" rx="1.5" fill="#22242c"/>
    <path d="M16,10 L56,10 L60,24 L12,24 Z" fill="#e8e6df"/>
    <path d="M18,12 L54,12 L57,23 L15,23 Z" fill="#28394b"/>
    <path d="M8,24 L64,24 L68,40 L4,40 Z" fill="#e8e6df"/>
    <rect x="26" y="30" width="20" height="7" rx="2" fill="#22242c"/>
    <text x="36" y="35.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.4" font-weight="bold" fill="#f2f2f2">POLICE</text>
    <rect x="8" y="31" width="10" height="6" rx="2" fill="#ffe9a8"/>
    <rect x="54" y="31" width="10" height="6" rx="2" fill="#ffe9a8"/>
    <rect x="4" y="40" width="64" height="9" rx="3" fill="#22242c"/>
    <rect x="2" y="46" width="12" height="9" rx="3" fill="#111116"/>
    <rect x="58" y="46" width="12" height="9" rx="3" fill="#111116"/>
  </g>

  <!-- corruptor running (back view) -->
  <g transform="translate(216,268) scale(2.1)">
    <ellipse cx="24" cy="60" rx="16" ry="4" fill="#000000" opacity="0.4"/>
    <path d="M32,20 L37,27 L35,34" stroke="#c99a72" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20,36 L14,48 L13,58" stroke="#26262e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28,36 L34,47 L37,57" stroke="#26262e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13,48 L13,58" stroke="#111116" stroke-width="8" stroke-linecap="round"/>
    <path d="M34,47 L37,57" stroke="#111116" stroke-width="8" stroke-linecap="round"/>
    <path d="M15,17 Q15,15 18,15 L30,15 Q33,15 33,17 L34,37 L14,37 Z" fill="#f2f2f2"/>
    <g fill="#26262e">
      <rect x="14.4" y="20" width="19.4" height="4"/>
      <rect x="14.6" y="27" width="19.2" height="4"/>
      <rect x="14.8" y="34" width="19" height="3.4"/>
    </g>
    <path d="M16,20 L11,28 L13,35" stroke="#e8b48a" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="10" r="6.6" fill="#e8b48a"/>
    <path d="M17.2,8.6 Q24,4.6 30.8,8.6 L30.8,5.6 Q24,1.6 17.2,5.6 Z" fill="#f2f2f2"/>
    <rect x="17" y="7.6" width="14" height="2.6" rx="1.3" fill="#d8d8dc"/>
  </g>

  <!-- police line tape on a lane -->
  <g transform="translate(60,300) scale(0.85)">
    <rect x="6" y="12" width="5" height="28" rx="2" fill="#8f939e"/>
    <rect x="65" y="12" width="5" height="28" rx="2" fill="#8f939e"/>
    <rect x="4" y="14" width="68" height="14" fill="#f2c230"/>
    <g fill="#22242c">
      <path d="M2,14 l10,14 h-7 l-10,-14 Z"/>
      <path d="M22,14 l10,14 h-7 l-10,-14 Z"/>
      <path d="M42,14 l10,14 h-7 l-10,-14 Z"/>
      <path d="M62,14 l10,14 h-7 l-10,-14 Z"/>
    </g>
  </g>
</svg>
