<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123d2c">
<meta name="description" content="Classic Klondike solitaire with drag-and-drop, hints, undo and sound.">
<title>Solitaire — Classic Klondike</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/ui-share.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M12 2C9.2 5.8 3 9.4 3 14.1c0 2.7 2.1 4.7 4.7 4.7 1.4 0 2.6-.5 3.4-1.4-.3 1.8-1 3.1-2.3 4.6h6.4c-1.3-1.5-2-2.8-2.3-4.6.8.9 2 1.4 3.4 1.4 2.6 0 4.7-2 4.7-4.7C21 9.4 14.8 5.8 12 2z"/>
        </svg>
      </span>
      <span class="brand-name">Solitaire</span>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">0:00</span></div>
    </div>

    <div class="actions">
      <div class="seg" role="group" aria-label="Draw mode">
        <button data-draw="1" class="seg-btn">Draw 1</button>
        <button data-draw="3" class="seg-btn">Draw 3</button>
      </div>
      <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
        <span class="lbl">Undo</span>
      </button>
      <button class="btn" id="hintBtn" title="Hint (H)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
        </svg>
        <span class="lbl">Hint</span>
      </button>
      <button class="btn icon-only" id="soundBtn" title="Toggle sound">
        <span class="ico-on">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/>
            <path d="M19.4 5.6a9 9 0 0 1 0 12.8"/>
          </svg>
        </span>
        <span class="ico-off">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4z"/>
            <line x1="22" y1="9" x2="16" y2="15"/>
            <line x1="16" y1="9" x2="22" y2="15"/>
          </svg>
        </span>
      </button>
      <button class="btn primary" id="newBtn" title="New game (N)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/>
          <path d="m18 2 4 4-4 4"/>
          <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
          <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
          <path d="m18 14 4 4-4 4"/>
        </svg>
        <span class="lbl">New game</span>
      </button>
    </div>
  </header>

  <main id="table">
    <div id="board"></div>
    <button id="autoBtn" class="auto-btn hidden">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/>
        <path d="m14 7 3 3"/>
        <path d="M5 6v4"/>
        <path d="M19 14v4"/>
        <path d="M10 2v2"/>
        <path d="M7 8H3"/>
        <path d="M21 16h-4"/>
        <path d="M11 3H9"/>
      </svg>
      <span>Auto finish</span>
    </button>
  </main>

  <div id="toast" class="toast"></div>

  <canvas id="winCanvas"></canvas>

  <div id="winModal" class="modal hidden">
    <div class="modal-card">
      <div class="trophy">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
      </div>
      <h2>You won!</h2>
      <p class="sub">Every card is home. Nicely played.</p>
      <div class="win-stats">
        <div><span class="stat-label">Time</span><span class="stat-value" id="winTime">0:00</span></div>
        <div><span class="stat-label">Moves</span><span class="stat-value" id="winMoves">0</span></div>
        <div><span class="stat-label">Score</span><span class="stat-value" id="winScore">0</span></div>
        <div><span class="stat-label">Best</span><span class="stat-value" id="winHighScore">0</span></div>
      </div>
      <button class="btn primary wide" id="playAgainBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/>
          <path d="m18 2 4 4-4 4"/>
          <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
          <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
          <path d="m18 14 4 4-4 4"/>
        </svg>
        <span>Play again</span>
      </button>
    </div>
  </div>

  <script src="../shared/ui-share.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
