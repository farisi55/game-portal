  <g transform="translate(210,20) scale(0.95)">
    <rect x="4" y="3" width="48" height="88" rx="12" fill="#f2c230"/>
    <rect x="4" y="3" width="48" height="88" rx="12" fill="none" stroke="#c79a1a" stroke-width="2"/>
    <rect x="13" y="30" width="30" height="24" rx="4" fill="#c79a1a" opacity="0.5"/>
    <rect x="14" y="16" width="28" height="11" rx="4" fill="#28394b"/>
    <path d="M11,58 Q11,55 15,55 L41,55 Q45,55 45,58 L43,72 Q42,74 40,74 L16,74 Q14,74 13,72 Z" fill="#28394b"/>
    <rect x="7" y="86" width="8" height="4.5" rx="2" fill="#fff3c4"/>
    <rect x="41" y="86" width="8" height="4.5" rx="2" fill="#fff3c4"/>
  </g>

  <!-- aggressive car (purple) -->
  <g transform="translate(330,150) scale(0.95)">
    <rect x="4" y="3" width="48" height="88" rx="12" fill="#8e44ad"/>
    <rect x="4" y="3" width="48" height="88" rx="12" fill="none" stroke="#6c3384" stroke-width="2"/>
    <path d="M25,4 h6 V90 h-6 Z" fill="#f4f1e8" opacity="0.85"/>
    <rect x="14" y="16" width="28" height="11" rx="4" fill="#1d2a3a"/>
    <path d="M11,58 Q11,55 15,55 L41,55 Q45,55 45,58 L43,72 Q42,74 40,74 L16,74 Q14,74 13,72 Z" fill="#1d2a3a"/>
    <rect x="7" y="86" width="8" height="4.5" rx="2" fill="#fff3c4"/>
    <rect x="41" y="86" width="8" height="4.5" rx="2" fill="#fff3c4"/>
  </g>

