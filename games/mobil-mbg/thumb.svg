<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <!-- grass shoulders -->
  <rect width="512" height="384" fill="#3f7d3a"/>
  <rect x="0" y="0" width="46" height="384" fill="#46893f"/>
  <rect x="466" y="0" width="46" height="384" fill="#46893f"/>
  <!-- asphalt -->
  <rect x="46" y="0" width="420" height="384" fill="#4a4a52"/>
  <!-- edge lines -->
  <rect x="50" y="0" width="6" height="384" fill="#e9e7de"/>
  <rect x="456" y="0" width="6" height="384" fill="#e9e7de"/>
  <!-- lane dashes -->
  <rect x="183.6" y="0" width="7" height="70" fill="#e9e7de"/>
  <rect x="183.6" y="130" width="7" height="70" fill="#e9e7de"/>
  <rect x="183.6" y="260" width="7" height="70" fill="#e9e7de"/>
  <rect x="321.6" y="60" width="7" height="70" fill="#e9e7de"/>
  <rect x="321.6" y="190" width="7" height="70" fill="#e9e7de"/>
