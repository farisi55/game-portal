<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script data-gimboot-canonical>
(function () {
  var d = document;
  if (d.querySelector('link[rel="canonical"]')) return;
  var h = location.hostname.toLowerCase();
  if (h === "localhost" || h === "127.0.0.1" || h === "0.0.0.0" || h === "[::1]") return;

  var ORIGIN = "https://gimboot.com";
  var path = location.pathname || "/";
  var search = location.search || "";
  var LOCAL = {
    "/games/kicau-mania": "/play/local-kicau-mania/kicau-mania",
    "/games/ayo-kopdes": "/play/local-ayo-kopdes/ayo-kopdes",
    "/games/mobil-mbg": "/play/local-mobil-mbg/mobil-mbg",
    "/games/kejar-koruptor": "/play/local-kejar-koruptor/kejar-koruptor",
    "/games/solitaire": "/play/local-solitaire/solitaire",
    "/games/moba": "/play/local-moba/moba-dota"
  };

  function slugify(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "game";
  }

  var noSlash = path.replace(/\/+$/, "") || "/";
  var canonicalPath = "";

  if (noSlash === "/" || /^\/index\.html?$/i.test(path)) {
    canonicalPath = "";
  } else if (/^\/game(\.html)?$/i.test(noSlash)) {
    var params = new URLSearchParams(search);
    var id = params.get("id");
    var title = params.get("title");
    canonicalPath = id
      ? "/play/" + encodeURIComponent(id) + (title ? "/" + slugify(title) : "")
      : "/game";
  } else {
    var directoryKey = path.replace(/\/index\.html?$/i, "").replace(/\/+$/, "");
    if (LOCAL[directoryKey]) {
      canonicalPath = LOCAL[directoryKey];
    } else if (/\/index\.html?$/i.test(path)) {
      canonicalPath = path.replace(/index\.html?$/i, "");
    } else if (/^\/games\/[^/]+$/i.test(noSlash) || noSlash === "/emulator") {
      canonicalPath = noSlash + "/";
    } else {
      canonicalPath = noSlash.replace(/\.html?$/i, "");
    }
  }

  var link = d.createElement("link");
  link.rel = "canonical";
  link.href = ORIGIN + canonicalPath;
  d.head.appendChild(link);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kicau Mania — Flappy Bird Bird Singing Contest</title>
<meta name="description" content="Flap your Murai Batu's wings past as many bamboo perches as you can. A Flappy Bird game themed around Indonesia's bird singing contests.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/ui-share.css">
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <span id="hud-score">0</span>
  </div>

  <button type="button" id="sound-toggle" class="sound-toggle" aria-label="Turn sound off" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
      <path id="sound-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.2 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path id="sound-mute-x" d="M16 8l5.5 8M21.5 8 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden></path>
    </svg>
  </button>

  <div id="loading-screen" class="screen">
    <p class="brand">KICAU MANIA</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint">Loading the arena…</p>
  </div>

  <div id="start-screen" class="screen" hidden>
    <p class="brand">KICAU MANIA</p>
    <p class="subtitle">Bird Singing Flight Contest</p>
    <p class="hint">Tap or press Space to fly</p>
    <p class="hint hint--small">Pass as many bamboo perches as you can</p>
  </div>

  <div id="gameover-screen" class="screen" hidden>
    <p class="brand brand--small">GAME OVER</p>
    <p id="new-record" class="new-record" hidden>NEW RECORD!</p>
    <div class="score-row">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span id="final-score" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span id="final-high" class="score-value">0</span>
      </div>
    </div>
    <button type="button" id="retry-btn" class="btn-retry">Play Again</button>
  </div>
</div>

<script src="../shared/ui-share.js"></script>
<script src="game.js"></script>
</body>
</html>
