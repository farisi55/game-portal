  </defs>

  <rect width="512" height="384" fill="url(#sky)"/>

  <!-- pegunungan & pepohonan jauh -->
  <path d="M0,260 Q80,210 160,260 T320,260 T480,260 L512,260 L512,384 L0,384 Z" fill="#9fc2ad"/>
  <circle cx="90" cy="255" r="34" fill="#488a4d"/>
  <circle cx="130" cy="262" r="26" fill="#3f7d45"/>
  <rect x="86" y="255" width="8" height="30" fill="#5c3d1e"/>

  <!-- tanah -->
  <rect x="0" y="330" width="512" height="54" fill="#8a5a2e"/>
  <rect x="0" y="330" width="512" height="14" fill="#7ec850"/>

  <!-- tiang bambu gantangan -->
  <rect x="420" y="60" width="34" height="270" fill="url(#bamboo)"/>
  <rect x="420" y="60" width="34" height="6" fill="#79571a" opacity="0.75"/>
  <rect x="420" y="150" width="34" height="6" fill="#79571a" opacity="0.75"/>
  <rect x="420" y="240" width="34" height="6" fill="#79571a" opacity="0.75"/>
  <rect x="450" y="96" width="30" height="9" rx="3" fill="#8a5a2e"/>
  <circle cx="482" cy="100.5" r="5.5" fill="#6b4321"/>

