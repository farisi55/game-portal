<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe7f0"/>
      <stop offset="100%" stop-color="#eaf6e6"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b98f22"/>
      <stop offset="45%" stop-color="#ecc75c"/>
      <stop offset="100%" stop-color="#a5791f"/>
