<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gimboot — No Install, Just Play, Have Fun</title>
<meta name="description" content="Gimboot: hundreds of free browser games, ready in a tap. No install, just play, have fun — racing, action, puzzle, and arcade classics, updated automatically.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e0b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimboot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Gimboot">
<meta property="og:title" content="Gimboot — No Install, Just Play, Have Fun">
<meta property="og:description" content="Hundreds of free browser games, ready in a tap. No install, just play, have fun.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Gimboot — No Install, Just Play, Have Fun">
<meta name="twitter:description" content="Hundreds of free browser games, ready in a tap. No install, just play, have fun.">

<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="chase-strip" aria-hidden="true"></div>
  <div class="header-inner">
    <a href="/" class="brand-lockup">
      <img src="/favicon.svg" alt="" class="brand-icon" width="100" height="100">
      <span class="brand-text">
        <span class="wordmark">GIMBOOT</span>
        <span class="tagline">No Install, Just Play, Have Fun</span>
      </span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search-input" class="search-input" type="search" placeholder="Search games…" aria-label="Search games">
    </div>
  </div>
  <nav class="category-bar" id="category-bar" role="tablist" aria-label="Filter by category"></nav>
</header>

<main>
  <div class="catalog-meta" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <span><span id="game-count">0</span> games loaded</span>
    <span id="high-score" class="high-score-pill">High Score: 0</span>
  </div>
  <div class="game-grid" id="game-grid"></div>
  <div class="status-block" id="grid-status" hidden></div>
</main>

<footer class="site-footer">
  <p>Gimboot — no install, just play, have fun. &copy; 2026 Powered by <a href="https://hazanacorp.farisi55.workers.dev/" target="_blank" rel="noopener">Hazana Corp</a> . Catalog refreshes automatically.</p>
</footer>

<script type="module" src="/js/catalog.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
