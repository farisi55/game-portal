# Required for this project's deployment model. Unlike a pure static Pages
# site (which can be drag-and-dropped via the dashboard with no config file
# at all), a Cloudflare Worker deployment needs this file to know its entry
# point, compatibility date, and static-assets directory. Deploy with:
#
#   npx wrangler deploy
#
# The old Pages-specific command `npx wrangler pages deploy .` does not
# apply to this build configuration.

name = "games"
main = "./src/index.js"
compatibility_date = "2026-07-28"

[assets]
directory = "."
binding = "ASSETS"
# This is a multi-page site with no client-side router, so an unmatched URL
# must be a real 404. The old "single-page-application" fallback served
# /index.html with 200 for every unknown path, creating soft-404 duplicates
# that Google reports as "Crawled - currently not indexed" (Task #032).
# Clean URLs still work: html_handling defaults to auto-trailing-slash
# (/emulator -> /emulator/, /emulator/runtime -> runtime.html).
not_found_handling = "none"
run_worker_first = [ "/*" ]

# Required by `npx wrangler preview` (staging-preview mechanism, Task #017).
# The block may be empty; it does not change production deploy behavior.
[previews]
