# Optional — only needed if you deploy via the Wrangler CLI instead of the
# Cloudflare dashboard's static asset builder. This repo deploys as a
# Cloudflare Worker with static assets, so the correct command is:
#
#   npx wrangler deploy
#
# The old Pages-specific command `npx wrangler pages deploy .` is not used
# by this build configuration.

name = "games"
main = "./src/index.js"
compatibility_date = "2026-07-28"

[assets]
header = "Content-Type: text/html; charset=utf-8"
directory = "."
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
